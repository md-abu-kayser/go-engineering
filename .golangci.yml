version: "2"

run:
  timeout: 10m
  tests: true

output:
  formats:
    text:
      colors: true
      path: stdout

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - misspell
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    revive:
      rules:
        - name: exported
        - name: var-naming
        - name: error-strings
        - name: error-naming

formatters:
  enable:
    - gofmt
    - goimports
