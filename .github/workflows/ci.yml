name: Go Engineering CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-engineering-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  GOTOOLCHAIN: "local"

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify repository structure and Go file count
        run: ./scripts/count-go.sh

      - name: Verify lesson index is reproducible
        run: |
          mkdir -p .tmp
          go run ./tools/lesson_index.go > .tmp/lesson-index.json
          cmp -s .tmp/lesson-index.json docs/LESSON_INDEX.json || {
            echo "docs/LESSON_INDEX.json is out of date."
            diff -u docs/LESSON_INDEX.json .tmp/lesson-index.json || true
            exit 1
          }
          rm -rf .tmp

  quality:
    name: Go quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: repository-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "The following files are not gofmt-formatted:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Validate modules
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Run race detector
        run: go test -race ./...

  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: repository-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4
          args: --timeout=10m
